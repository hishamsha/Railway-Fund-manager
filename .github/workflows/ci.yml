name: Application checks
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      MIGRATION_DATABASE_URL: postgresql://postgres:ci_password@127.0.0.1:5432/railway_test?schema=app
      DATABASE_URL: postgresql://postgres:ci_password@127.0.0.1:5432/railway_test?schema=app
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: railway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d railway_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      # A historical migration grants to the restricted runtime role, which a
      # fresh database lacks; create it the way the hosted setup expects.
      - name: Create runtime role
        run: psql "postgresql://postgres:ci_password@127.0.0.1:5432/railway_test" -c "CREATE ROLE app_runtime NOLOGIN"
      - run: npm run db:migrate:deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run db:reconcile
      - run: docker build -t train-fund-manager-api:ci .
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
